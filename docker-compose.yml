version: '3.8'

services:

  # ── Edge Reverse Proxy ───────────────────────────────────────────────────────

  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - auth-service
      - finance-service
      - productivity-service
      - habit-service
      - notification-service
      - insight-service
    networks:
      - klenzo_network

  # ── Microservices Application Tier ──────────────────────────────────────────

  auth-service:
    build:
      context: .
      dockerfile: Dockerfile.microservice
      args:
        APP_NAME: auth-service
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3001
      - DATABASE_URL=postgresql://klenzo:klenzo_password@postgres:5432/klenzo_db?schema=auth
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - JWT_SECRET=super_secret_jwt_key
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - klenzo_network

  finance-service:
    build:
      context: .
      dockerfile: Dockerfile.microservice
      args:
        APP_NAME: finance-service
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3002
      - DATABASE_URL=postgresql://klenzo:klenzo_password@postgres:5432/klenzo_db?schema=finance
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - JWT_SECRET=super_secret_jwt_key
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - klenzo_network

  productivity-service:
    build:
      context: .
      dockerfile: Dockerfile.microservice
      args:
        APP_NAME: productivity-service
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3003
      - DATABASE_URL=postgresql://klenzo:klenzo_password@postgres:5432/klenzo_db?schema=productivity
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - JWT_SECRET=super_secret_jwt_key
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - klenzo_network

  habit-service:
    build:
      context: .
      dockerfile: Dockerfile.microservice
      args:
        APP_NAME: habit-service
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3004
      - DATABASE_URL=postgresql://klenzo:klenzo_password@postgres:5432/klenzo_db?schema=habit
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - JWT_SECRET=super_secret_jwt_key
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - klenzo_network

  notification-service:
    build:
      context: .
      dockerfile: Dockerfile.microservice
      args:
        APP_NAME: notification-service
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3005
      - DATABASE_URL=postgresql://klenzo:klenzo_password@postgres:5432/klenzo_db?schema=notifications
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - SMTP_HOST=mailpit
      - SMTP_PORT=1025
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - klenzo_network

  insight-service:
    build:
      context: .
      dockerfile: Dockerfile.microservice
      args:
        APP_NAME: insight-service
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3006
      - DATABASE_URL=postgresql://klenzo:klenzo_password@postgres:5432/klenzo_db?schema=public
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - klenzo_network

  # ── Infrastructure Tier ─────────────────────────────────────────────────────

  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: klenzo
      POSTGRES_PASSWORD: klenzo_password
      POSTGRES_DB: klenzo_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U klenzo -d klenzo_db"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - klenzo_network

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - klenzo_network

  minio:
    image: quay.io/minio/minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: klenzo_admin
      MINIO_ROOT_PASSWORD: klenzo_password
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    networks:
      - klenzo_network

  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"
    networks:
      - klenzo_network

volumes:
  postgres_data:
  minio_data:

networks:
  klenzo_network:
    driver: bridge
