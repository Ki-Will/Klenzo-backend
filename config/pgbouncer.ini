; PgBouncer Configuration for Klenzo Backend
; Deploy alongside PostgreSQL for connection pooling

[databases]
klenzo_db = host=postgres port=5432 dbname=klenzo_db

[pgbouncer]
; Connection pooling mode
pool_mode = transaction

; Maximum client connections
max_client_conn = 1000

; Default pool size (connections per user/database pair)
default_pool_size = 20

; Minimum connections to keep alive
min_pool_size = 5

; Maximum connections per pool
max_pool_size = 50

; Time to wait for server connection (ms)
server_connect_timeout = 5000

; Time to wait for server query result (ms)
server_login_retry = 1000

; Idle transaction timeout (ms) — kill stale transactions
idle_transaction_timeout = 60000

; Query timeout (ms) — kill long-running queries
query_timeout = 30000

; Client idle timeout (ms)
client_idle_timeout = 0

; Disable login on server connections for speed
server_reset_query = DISCARD ALL

; Logging
log_connections = 0
log_disconnections = 0
log_pooler_errors = 1
stats_period = 60

; Authentication
auth_type = md5
auth_file = /etc/pgbouncer/userlist.txt

; TLS (optional)
; client_tls_sslmode = require
; client_tls_key_file = /etc/pgbouncer/server.key
; client_tls_cert_file = /etc/pgbouncer/server.crt
